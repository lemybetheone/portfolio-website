<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lemuel Calinog — Analytics Engineer</title>
  <meta name="description" content="I own a production data warehouse end to end — Python ingestion, BigQuery modelling, and the BI layer on top.">
  <style>
    :root {
      --ink: #14181f;
      --paper: #fbfaf8;
      --muted: #5c6672;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e9ecf0;
        --paper: #14181f;
        --muted: #98a2ad;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2rem 1.25rem;
      min-height: 100vh;
      display: flex;
      align-items: center;
      background: var(--paper);
      color: var(--ink);
      font: 400 1rem/1.6 ui-sans-serif, system-ui, -apple-system,
            "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    main { max-width: 34rem; margin: 0 auto; }
    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.75rem, 6vw, 2.75rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
    }
    p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Lemuel Calinog</h1>
    <p>Analytics engineer. This site is being built &mdash; the work is not.</p>
  </main>
</body>
</html>
